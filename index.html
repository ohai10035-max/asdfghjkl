<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简业务价目表 Pro</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-page: #f9f9f9;
            --bg-paper: #ffffff;
            --text-color: #333333;
            --text-light: #b0b0b0;
            --accent-color: #9d8461; 
            --del-color: #ff4d4f;
            --add-color: #007aff;
            --custom-font: "PingFang SC", "Hiragino Sans GB", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-page);
            color: var(--text-color);
            font-family: var(--custom-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 180px;
        }

        #menu-canvas {
            background: var(--bg-paper);
            width: 100%;
            max-width: 400px;
            padding: 60px 40px;
            min-height: 700px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }

        header { border-bottom: 1px solid #eee; margin-bottom: 40px; padding-bottom: 15px; }
        header h1 { font-size: 18px; font-weight: 300; letter-spacing: 4px; outline: none; }
        header p { font-size: 9px; color: var(--text-light); letter-spacing: 2px; margin-top: 5px; outline: none; }

        .intro-box { margin-bottom: 35px; }
        .intro-title { font-size: 11px; font-weight: 600; margin-bottom: 5px; outline: none; }
        .intro-text { font-size: 10px; color: var(--text-light); line-height: 1.6; outline: none; }

        .category-group { margin-bottom: 30px; }
        .category-header { display: flex; align-items: center; margin-bottom: 15px; }
        .category-name { font-size: 13px; font-weight: 600; color: #555; outline: none; flex-shrink: 0; }
        .category-line { flex-grow: 1; height: 1px; background: #f0f0f0; margin-left: 10px; }

        .edit-only { display: none; }
        body.edit-on .edit-only { display: inline-flex; }

        .btn-action { font-size: 10px; cursor: pointer; margin-left: 8px; padding: 2px 6px; border-radius: 4px; border: 1px solid; background: #fff; white-space: nowrap; }
        .btn-add-item { color: var(--add-color); border-color: var(--add-color); }
        .btn-del-cat { color: var(--del-color); border-color: var(--del-color); }

        .item-row { display: flex; align-items: flex-start; margin-bottom: 15px; position: relative; }
        .row-del-mark { color: var(--del-color); cursor: pointer; font-size: 12px; margin-right: 8px; font-weight: bold; margin-top: 2px; }

        .item-content { flex: 1; }
        .item-title { font-size: 12px; font-weight: 400; outline: none; display: block; }
        .item-desc { font-size: 9px; color: var(--text-light); outline: none; margin-top: 2px; }

        .price-info { text-align: right; margin-left: 10px; }
        .price-val { font-size: 11px; font-weight: 500; outline: none; }
        .price-sub { font-size: 9px; color: var(--accent-color); outline: none; margin-top: 1px; }

        .benefit-box { margin-top: auto; padding-top: 30px; border-top: 1px dashed #eee; }
        .benefit-title { font-size: 10px; font-weight: 600; margin-bottom: 8px; outline: none; color: var(--accent-color); }
        .benefit-content { font-size: 9px; color: var(--text-light); line-height: 1.8; outline: none; }

        .controls-dock {
            position: fixed; bottom: 30px; background: #222; padding: 10px 20px;
            border-radius: 50px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 9999; color: white;
        }
        .switch-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .toggle-input { 
            appearance: none; -webkit-appearance: none; width: 36px; height: 20px; 
            background: #555; border-radius: 20px; position: relative; cursor: pointer; 
            transition: .3s; border: none; outline: none; overflow: hidden; margin: 0;
        }
        .toggle-input:checked { background: var(--add-color); }
        .toggle-input::before { 
            content: ''; position: absolute; width: 16px; height: 16px; 
            background: white; border-radius: 50%; top: 2px; left: 2px; transition: .3s;
        }
        .toggle-input:checked::before { transform: translateX(16px); }

        .c-btn { background: white; color: #222; border: none; padding: 8px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; font-weight: bold; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center;
        }
        .modal-card {
            background: #f7f7f7; width: 90%; max-width: 380px; padding: 20px; border-radius: 24px;
            animation: modalPop 0.2s ease-out;
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .font-item-container {
            background: #fff; border-radius: 12px; margin-bottom: 10px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; border: 1.5px solid transparent;
        }
        .font-item-container.active { border-color: var(--add-color); background: #f0f7ff; }
        .font-info { flex: 1; font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .f-icon { width: 18px; height: 18px; opacity: 0.4; cursor: pointer; margin-left: 12px; }

        .input-box { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin: 15px 0; outline: none; font-size: 14px; }
        .modal-tip { font-size: 13px; color: #666; margin: 10px 0 20px; line-height: 1.4; }
        .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>
<body>

    <div id="menu-canvas">
        <header>
            <h1 contenteditable="true">STUDIO MENU</h1>
            <p contenteditable="true">Tarot & Magic / 价目表</p>
        </header>

        <div class="intro-box">
            <div class="intro-title" contenteditable="true">ABOUT ME / 店主介绍</div>
            <div class="intro-text" contenteditable="true">这里是雨花的小店。</div>
        </div>

        <div id="list-root">
            <div class="category-group">
                <div class="category-header">
                    <div class="category-name" contenteditable="true">占卜方案 / Tarot</div>
                    <div class="category-line"></div>
                    <div class="edit-only">
                        <span class="btn-action btn-add-item" onclick="addItemTo(this)">＋新增商品</span>
                        <span class="btn-action btn-del-cat" onclick="this.parentElement.parentElement.parentElement.remove()">×删除分类</span>
                    </div>
                </div>
                <div class="items-container">
                    <div class="item-row">
                        <span class="row-del-mark edit-only" onclick="this.parentElement.remove()">×</span>
                        <div class="item-content">
                            <span class="item-title" contenteditable="true">自定义文本</span>
                            <span class="item-desc" contenteditable="true">备注</span>
                        </div>
                        <div class="price-info">
                            <div class="price-val" contenteditable="true">自定义价格</div>
                            <div class="price-sub" contenteditable="true">自定义优惠价格</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="benefit-box">
            <div class="benefit-title" contenteditable="true">WISH / 碎碎念</div>
            <div class="benefit-content" contenteditable="true">
                • 开启编辑模式后，可单独为每个分类增加商品。<br>
                • 改好后关闭编辑模式，存图更干净。<br>
                • 直接点击文字可编辑。
            </div>
        </div>
    </div>

    <div class="controls-dock">
        <div class="switch-wrap">
            编辑
            <input type="checkbox" id="editToggle" class="toggle-input" onchange="handleModeChange()">
        </div>
        <button class="c-btn edit-only" onclick="addNewCat()">+分类</button>
        <button class="c-btn" onclick="toggleFontModal()">字体管理</button>
        <button class="c-btn save-btn" style="background:var(--accent-color);color:white;" onclick="exportImg()">保存为图片</button>
    </div>

    <div id="font-modal" class="modal-overlay" onclick="if(event.target==this) toggleFontModal()">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <b style="font-size:15px;">UI主题选择</b>
                <span class="btn-action btn-add-item" style="border-radius:20px;" onclick="document.getElementById('fontInput').click()">+ 导入字体</span>
                <input type="file" id="fontInput" style="display:none" accept=".ttf,.otf,.woff,.woff2" onchange="importFont(this)">
            </div>
            <div id="font-list" style="max-height:350px; overflow-y:auto;"></div>
        </div>
    </div>

    <div id="common-modal" class="modal-overlay">
        <div class="modal-card">
            <b id="modal-title" style="font-size:15px;">标题</b>
            <div id="modal-content"></div>
            <div class="btn-row">
                <button class="c-btn" style="background:#eee" onclick="closeCommonModal()">取消</button>
                <button class="c-btn" style="background:var(--add-color);color:white" id="modal-confirm-btn">确定</button>
            </div>
        </div>
    </div>

    <script>
        let db;
        let selectedId = localStorage.getItem('active_font_id') || 'default';
        const dbReq = indexedDB.open("FontMemory", 1);
        dbReq.onupgradeneeded = e => e.target.result.createObjectStore("fonts", {keyPath:"id"});
        dbReq.onsuccess = e => { db = e.target.result; refreshFontPool(); };

        async function registerFontFace(id, dataUrl) {
            try {
                const font = new FontFace(id, `url(${dataUrl})`, { display: 'swap' });
                const loaded = await font.load();
                document.fonts.add(loaded);
                return true;
            } catch (err) { return false; }
        }

        function refreshFontPool() {
            const tx = db.transaction("fonts", "readonly");
            tx.objectStore("fonts").getAll().onsuccess = async (e) => {
                const list = e.target.result;
                for (let f of list) await registerFontFace(f.id, f.data);
                renderUI(list);
                applyToVariables();
            };
        }

        function renderUI(list) {
            const container = document.getElementById('font-list');
            let html = `<div class="font-item-container ${selectedId==='default'?'active':''}" onclick="switchTheme('default')"><div class="font-info">系统默认</div></div>`;
            list.forEach(f => {
                html += `<div class="font-item-container ${selectedId===f.id?'active':''}">
                    <div class="font-info" style="font-family:'${f.id}'" onclick="switchTheme('${f.id}')">${f.name}</div>
                    <div style="display:flex">
                        <svg class="f-icon" onclick="openRename('${f.id}','${f.name}',event)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        <svg class="f-icon" style="stroke:var(--del-color)" onclick="confirmDelete('${f.id}',event)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function applyToVariables() {
            const fontStack = selectedId === 'default' ? `"PingFang SC", sans-serif` : `"${selectedId}"`;
            document.documentElement.style.setProperty('--custom-font', fontStack);
        }

        function switchTheme(id) { selectedId = id; localStorage.setItem('active_font_id', id); refreshFontPool(); }

        function importFont(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const tx = db.transaction("fonts", "readwrite");
                tx.objectStore("fonts").add({id: 'f_'+Date.now(), name: file.name.split('.')[0], data: e.target.result});
                tx.oncomplete = () => { refreshFontPool(); input.value = ''; };
            };
            reader.readAsDataURL(file);
        }

        function showModal(title, contentHtml, onConfirm) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = contentHtml;
            const modal = document.getElementById('common-modal');
            modal.style.display = 'flex';
            document.getElementById('modal-confirm-btn').onclick = onConfirm;
        }
        function closeCommonModal() { document.getElementById('common-modal').style.display = 'none'; }

        function openRename(id, oldName, e) {
            e.stopPropagation();
            const html = `<input type="text" id="modal-input" class="input-box" value="${oldName}">`;
            showModal("重命名主题", html, () => {
                const newName = document.getElementById('modal-input').value;
                const tx = db.transaction("fonts", "readwrite");
                const store = tx.objectStore("fonts");
                store.get(id).onsuccess = ev => {
                    const data = ev.target.result; data.name = newName; store.put(data);
                    tx.oncomplete = () => { refreshFontPool(); closeCommonModal(); };
                };
            });
        }

        function confirmDelete(id, e) {
            e.stopPropagation();
            const html = `<div class="modal-tip">确定要删除这个字体吗？</div>`;
            showModal("确认删除", html, () => {
                const tx = db.transaction("fonts", "readwrite");
                tx.objectStore("fonts").delete(id);
                if(selectedId === id) switchTheme('default');
                tx.oncomplete = () => { refreshFontPool(); closeCommonModal(); };
            });
        }

        function toggleFontModal() {
            const m = document.getElementById('font-modal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleModeChange() { document.body.classList.toggle('edit-on', document.getElementById('editToggle').checked); }
        
        function addNewCat() {
            const root = document.getElementById('list-root');
            const div = document.createElement('div');
            div.className = 'category-group';
            div.innerHTML = `<div class="category-header"><div class="category-name" contenteditable="true">新分类名称</div><div class="category-line"></div><div class="edit-only"><span class="btn-action btn-add-item" onclick="addItemTo(this)">＋新增商品</span><span class="btn-action btn-del-cat" onclick="this.parentElement.parentElement.parentElement.remove()">×删除分类</span></div></div><div class="items-container"></div>`;
            root.appendChild(div); addItemTo(div.querySelector('.btn-add-item'));
        }
        function addItemTo(btn) {
            const container = btn.parentElement.parentElement.nextElementSibling;
            const div = document.createElement('div');
            div.className = 'item-row';
            div.innerHTML = `<span class="row-del-mark edit-only" onclick="this.parentElement.remove()">×</span><div class="item-content"><span class="item-title" contenteditable="true">新商品项目</span><span class="item-desc" contenteditable="true">描述内容</span></div><div class="price-info"><div class="price-val" contenteditable="true">¥0</div><div class="price-sub" contenteditable="true">会员 ¥0</div></div>`;
            container.appendChild(div);
        }

        function exportImg() {
            document.getElementById('editToggle').checked = false; handleModeChange();
            const btn = document.querySelector('.save-btn');
            btn.innerText = "生成中...";
            setTimeout(() => {
                // scale: 2 是为了兼容 APK 运行环境，防止闪退
                html2canvas(document.querySelector("#menu-canvas"), { backgroundColor: "#ffffff", scale: 3, useCORS: true }).then(canvas => {
                    const link = document.createElement('a'); link.download = '价目表_' + Date.now() + '.png';
                    link.href = canvas.toDataURL(); link.click(); btn.innerText = "保存为图片";
                });
            }, 200);
        }
    </script>
</body>
</html>
